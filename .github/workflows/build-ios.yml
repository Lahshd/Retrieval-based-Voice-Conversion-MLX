name: 🍎 Cloud iOS IPA Compiler

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile RVC MLX iOS App
    runs-on: macos-14
    
    steps:
      - name: 📦 Checkout Repository Source
        uses: actions/checkout@v4
        with:
          submodules: false # Disabled to prevent crashing on the broken mlx-swift reference

      - name: 🔧 Clean Broken Submodule References
        run: |
          # Force remove the invalid/empty vendor folder breaking git commands
          rm -rf Demos/iOS/RVCNative/Vendor/mlx-swift || true

      - name: 🔧 Select Latest Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: 🌐 Configure Git for Public HTTPS Package Resolution
        run: |
          git config --global url."https://github.com".insteadOf "git@github.com:"
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltInSCM YES

      - name: 🛠️ Force Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project RVC-MLX.xcodeproj \
            -scheme "RVC-MLX"

      - name: 🔨 Compile & Build Archive (Unsigned Template)
        run: |
          xcodebuild archive \
            -project RVC-MLX.xcodeproj \
            -scheme "RVC-MLX" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $GITHUB_WORKSPACE/build/RVC-MLX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 📦 Structure Unsigned App Into Payload Directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/Payload
          cp -r $GITHUB_WORKSPACE/build/RVC-MLX.xcarchive/Products/Applications/*.app $GITHUB_WORKSPACE/build/Payload/
          cd $GITHUB_WORKSPACE/build
          zip -r RVC-MLX-Unsigned.ipa Payload

      - name: 📤 Upload Finished IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RVC-MLX-Mobile-Bundle
          path: ${{ github.workspace }}/build/RVC-MLX-Unsigned.ipa
          retention-days: 7
