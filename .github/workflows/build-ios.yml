name: 🍎 Cloud iOS IPA Compiler

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile RVC MLX iOS App
    runs-on: macos-14
    
    steps:
      - name: 📦 Checkout Repository Source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 🔧 Clean Broken Submodule References
        run: |
          rm -rf Demos/iOS/RVCNative/Vendor/mlx-swift || true

      - name: 🔧 Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: 🌐 Configure Git Resolution
        run: |
          git config --global url."https://github.com".insteadOf "git@github.com:"
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltInSCM YES

      - name: 🛠️ Force Resolve Swift Package Dependencies
        run: |
          cd Demos/iOS/RVCNative
          xcodebuild -resolvePackageDependencies \
            -project RVCNative.xcodeproj \
            -scheme "RVCNative"

      - name: 🔨 Compile Build Folder (No Code Signing Required)
        run: |
          cd Demos/iOS/RVCNative
          xcodebuild build \
            -project RVCNative.xcodeproj \
            -scheme "RVCNative" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 📦 Structure Unsigned App Into Payload Directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/Payload
          cd ~/Library/Developer/Xcode/DerivedData
          APP_PATH=$(find . -name "RVCNative.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          cp -r "$APP_PATH" $GITHUB_WORKSPACE/build/Payload/
          cd $GITHUB_WORKSPACE/build
          zip -r RVC-MLX-Unsigned.ipa Payload

      - name: 📤 Upload Finished IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RVC-MLX-Mobile-Bundle
          path: ${{ github.workspace }}/build/RVC-MLX-Unsigned.ipa
          retention-days: 7
