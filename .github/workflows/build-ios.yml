name: 🍎 Cloud iOS IPA Compiler

on:
  workflow_dispatch:

env:
  PROJECT_DIR: Demos/iOS/RVCNative
  DERIVED: ${{ github.workspace }}/build/DerivedData
  LOGS: ${{ github.workspace }}/build/logs

jobs:
  build-ipa:
    name: Compile RVC MLX iOS App
    runs-on: macos-15

    steps:
      - name: 📦 Checkout Repository Source
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: 🔍 Diagnose how mlx-swift is referenced
        run: |
          echo "--- .gitmodules ---"
          cat .gitmodules 2>/dev/null || echo "(none)"
          echo "--- gitlinks (mode 160000) ---"
          git ls-files -s | grep '^160000' || echo "(none)"
          echo "--- project.pbxproj package refs ---"
          grep -nE "mlx|XCLocalSwiftPackageReference|XCRemoteSwiftPackageReference|relativePath|repositoryURL" \
            "$PROJECT_DIR/RVCNative.xcodeproj/project.pbxproj" || true
          echo "--- Package.resolved ---"
          find "$PROJECT_DIR" -name Package.resolved -not -path "*/Vendor/*" -exec cat {} \; || true

      - name: 🔧 Select Xcode 16 (project format 77 needs Xcode 16+)
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 🌐 Configure Git Resolution
        run: |
          # NOTE the trailing slash after github.com - without it the rewritten URL is broken
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltInSCM YES

      - name: 🛠️ Resolve Swift Package Dependencies
        run: |
          set -o pipefail
          mkdir -p "$LOGS"
          cd "$PROJECT_DIR"
          xcodebuild -resolvePackageDependencies \
            -project RVCNative.xcodeproj \
            -scheme "RVCNative" \
            -derivedDataPath "$DERIVED" \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tee "$LOGS/resolve.log"

      - name: 🔨 Compile Build (No Code Signing Required)
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          xcodebuild build \
            -project RVCNative.xcodeproj \
            -scheme "RVCNative" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee "$LOGS/build.log"

      - name: 📦 Structure Unsigned App Into Payload Directory
        run: |
          APP_PATH="$DERIVED/Build/Products/Release-iphoneos/RVCNative.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found at $APP_PATH. Found:"
            find "$DERIVED/Build/Products" -name "*.app" -maxdepth 3
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/"
          cd "$GITHUB_WORKSPACE/build"
          zip -qry RVC-MLX-Unsigned.ipa Payload

      - name: 📤 Upload Finished IPA
        uses: actions/upload-artifact@v6
        with:
          name: RVC-MLX-Mobile-Bundle
          path: ${{ github.workspace }}/build/RVC-MLX-Unsigned.ipa
          retention-days: 7

      - name: 📤 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-logs
          path: ${{ github.workspace }}/build/logs
          retention-days: 3
          if-no-files-found: ignore
