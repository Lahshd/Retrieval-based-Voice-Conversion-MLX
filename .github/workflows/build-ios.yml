name: 🍎 Cloud iOS IPA Compiler

on:
  workflow_dispatch:

env:
  PROJECT_DIR: Demos/iOS/RVCNative
  DERIVED: ${{ github.workspace }}/build/DerivedData
  LOGS: ${{ github.workspace }}/build/logs

jobs:
  build-ipa:
    name: Compile RVC MLX iOS App
    runs-on: macos-15

    steps:
      - name: 📦 Checkout Repository Source
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: 🔍 Diagnose project layout
        run: |
          cd "$PROJECT_DIR"
          echo "--- directory ---"; ls -la
          echo "--- workspaces / local packages ---"
          find . \( -name "*.xcworkspace" -o -name Package.swift \) \
            -not -path "*/.build/*" -not -path "*/xcuserdata/*" -not -path "*/Vendor/*" -not -path "*/.swiftpm/*"
          echo "--- where RVCNativeFeature is defined ---"
          grep -rn "RVCNativeFeature" --include=Package.swift . || echo "(not found in any Package.swift)"
          echo "--- package refs in pbxproj ---"
          grep -nE "mlx|XCLocalSwiftPackageReference|XCRemoteSwiftPackageReference|relativePath|repositoryURL" \
            RVCNative.xcodeproj/project.pbxproj || true
          echo "--- dependencies declared by local packages ---"
          find . -name Package.swift -not -path "*/.build/*" -not -path "*/Vendor/*" \
            -exec sh -c 'echo "## $1"; grep -nE "\.package\(|path:|url:" "$1"' _ {} \; || true
          echo "--- repo .gitmodules / gitlinks ---"
          cd "$GITHUB_WORKSPACE"
          cat .gitmodules 2>/dev/null || echo "(no .gitmodules)"
          git ls-files -s | grep '^160000' || echo "(no gitlinks)"

      - name: 🔧 Select newest stable Xcode (26 preferred, 16 fallback)
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 🎛️ Download Metal toolchain (Xcode 26+ only)
        run: |
          if xcodebuild -version | head -n 1 | grep -q "Xcode 26"; then
            xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain download failed or not needed; continuing"
          else
            echo "Not Xcode 26, skipping"
          fi

      - name: 🧭 Pick workspace vs project
        run: |
          cd "$PROJECT_DIR"
          if [ -d RVCNative.xcworkspace ]; then
            echo "XCODE_CONTAINER=-workspace RVCNative.xcworkspace" >> "$GITHUB_ENV"
            echo "Using workspace"
          else
            echo "XCODE_CONTAINER=-project RVCNative.xcodeproj" >> "$GITHUB_ENV"
            echo "No workspace found, using project"
          fi

      - name: 🌐 Configure Git Resolution
        run: |
          # NOTE the trailing slash after github.com - without it the rewritten URL is broken
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltInSCM YES

      - name: 📥 Fetch mlx-swift into Vendor/ (pinned to repo's gitlink commit if possible)
        run: |
          DEST="$PROJECT_DIR/Vendor/mlx-swift"
          SHA=$(git ls-files -s -- "$DEST" | awk '$1=="160000"{print $2}')
          echo "Pinned gitlink commit: ${SHA:-none}"
          rm -rf "$DEST"
          git clone https://github.com/ml-explore/mlx-swift "$DEST"
          if [ -n "$SHA" ] && git -C "$DEST" checkout "$SHA"; then
            echo "Checked out pinned commit $SHA"
          else
            echo "::warning::Could not check out pinned commit; using default branch at $(git -C "$DEST" rev-parse --short HEAD)"
          fi
          git -C "$DEST" submodule update --init --recursive --depth 1
          ls -la "$DEST/Package.swift"

      - name: 🛠️ Resolve Swift Package Dependencies
        run: |
          set -o pipefail
          mkdir -p "$LOGS"
          cd "$PROJECT_DIR"
          xcodebuild -list $XCODE_CONTAINER
          xcodebuild -resolvePackageDependencies \
            $XCODE_CONTAINER \
            -scheme "RVCNative" \
            -derivedDataPath "$DERIVED" \
            -skipPackagePluginValidation \
            -skipMacroValidation 2>&1 | tee "$LOGS/resolve.log"

      - name: 🔨 Compile Build (No Code Signing Required)
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          xcodebuild build \
            $XCODE_CONTAINER \
            -scheme "RVCNative" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee "$LOGS/build.log"

      - name: 📦 Structure Unsigned App Into Payload Directory
        run: |
          APP_PATH="$DERIVED/Build/Products/Release-iphoneos/RVCNative.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found at $APP_PATH. Found:"
            find "$DERIVED/Build/Products" -name "*.app" -maxdepth 3
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/build/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/Payload/"
          cd "$GITHUB_WORKSPACE/build"
          zip -qry RVC-MLX-Unsigned.ipa Payload

      - name: 📤 Upload Finished IPA
        uses: actions/upload-artifact@v6
        with:
          name: RVC-MLX-Mobile-Bundle
          path: ${{ github.workspace }}/build/RVC-MLX-Unsigned.ipa
          retention-days: 7

      - name: 📤 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-logs
          path: ${{ github.workspace }}/build/logs
          retention-days: 3
          if-no-files-found: ignore
